<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="CampusKit setup guide for college students.">
    <title>CampusKit - Setup Guide</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
            line-height: 1.6;
        }

        header {
            background: #111827;
            color: white;
            padding: 45px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        header p {
            color: #d1d5db;
            font-size: 17px;
        }

        .container {
            max-width: 900px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 30px;
            margin-bottom: 22px;
            border-radius: 16px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.07);
        }

        .card h2 {
            margin-bottom: 14px;
            color: #111827;
            font-size: 25px;
        }

        .card p {
            margin-bottom: 12px;
            color: #4b5563;
        }

        .step {
            display: flex;
            gap: 16px;
            margin: 22px 0;
            align-items: flex-start;
        }

        .number {
            min-width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #111827;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .step-content {
            flex: 1;
        }

        .step-content h3 {
            margin-bottom: 6px;
            color: #111827;
            font-size: 19px;
        }

        .step-content p {
            margin: 0;
        }

        .tip {
            background: #eef2ff;
            border-left: 4px solid #4f46e5;
            padding: 16px;
            margin-top: 18px;
            border-radius: 8px;
            color: #374151;
        }

        .tip strong {
            color: #111827;
        }

        .back-btn {
            display: inline-block;
            margin-top: 12px;
            padding: 12px 20px;
            background: #111827;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.2s;
        }

        .back-btn:hover {
            background: #374151;
        }

        .checklist {
            list-style: none;
            margin-top: 10px;
        }

            padding: 10px 0;
            border-bottom: 1px solid #e5e7eb;
            color: #4b5563
